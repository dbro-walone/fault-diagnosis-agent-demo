<div id="fault-storyboard-v2">
  <style>
    #fault-storyboard-v2 { color: var(--foreground); }
    #fault-storyboard-v2 .scene-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    #fault-storyboard-v2 .scene-head strong { font-weight:500; }
    #fault-storyboard-v2 .phase-track { display:grid; grid-template-columns:repeat(8,1fr); gap:5px; margin:12px 0 14px; }
    #fault-storyboard-v2 .phase { height:5px; border-radius:99px; background:var(--muted); }
    #fault-storyboard-v2 .phase.done { background:var(--viz-series-1); }
    #fault-storyboard-v2 .main { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(250px,.75fr); gap:16px; align-items:stretch; }
    #fault-storyboard-v2 .canvas { min-height:360px; position:relative; display:flex; flex-direction:column; justify-content:center; }
    #fault-storyboard-v2 .topology { display:grid; grid-template-columns:.7fr .8fr 2.4fr; gap:12px; align-items:center; }
    #fault-storyboard-v2 .lane,#fault-storyboard-v2 .zone { display:flex; flex-direction:column; gap:9px; align-items:center; }
    #fault-storyboard-v2 .device { position:relative; display:grid; grid-template-columns:.75fr 1fr 1fr .8fr; gap:9px; min-height:230px; align-items:center; padding:30px 10px 12px; border:1px solid var(--border); border-radius:12px; }
    #fault-storyboard-v2 .device-label { position:absolute; top:8px; left:12px; color:var(--muted-foreground); }
    #fault-storyboard-v2 .zone-label { color:var(--muted-foreground); }
    #fault-storyboard-v2 .node { min-width:74px; padding:8px 6px; text-align:center; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--card-foreground); transition:opacity .3s,transform .3s,box-shadow .3s,border-color .3s; }
    #fault-storyboard-v2 .node.active { border-color:var(--viz-series-1); box-shadow:0 0 0 3px color-mix(in srgb,var(--viz-series-1) 22%,transparent); transform:translateY(-2px); }
    #fault-storyboard-v2 .node.warn { border-color:var(--viz-series-3); box-shadow:0 0 0 3px color-mix(in srgb,var(--viz-series-3) 24%,transparent); }
    #fault-storyboard-v2 .node.root { border-color:var(--destructive); box-shadow:0 0 0 4px color-mix(in srgb,var(--destructive) 25%,transparent),0 0 18px color-mix(in srgb,var(--destructive) 18%,transparent); }
    #fault-storyboard-v2 .node.good { border-color:var(--green); box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent); }
    #fault-storyboard-v2 .node.dim { opacity:.25; }
    #fault-storyboard-v2 .link { color:var(--muted-foreground); text-align:center; }
    #fault-storyboard-v2 .link.hot { color:var(--viz-series-3); }
    #fault-storyboard-v2 .panel { display:flex; flex-direction:column; gap:10px; min-width:0; }
    #fault-storyboard-v2 .panel-heading { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    #fault-storyboard-v2 .panel-heading strong { font-weight:500; }
    #fault-storyboard-v2 .stack { display:flex; flex-direction:column; gap:8px; }
    #fault-storyboard-v2 .row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:start; padding-bottom:7px; border-bottom:1px solid var(--border); }
    #fault-storyboard-v2 .row:last-child { border-bottom:0; }
    #fault-storyboard-v2 .row strong { font-weight:500; }
    #fault-storyboard-v2 .confidence { font-variant-numeric:tabular-nums; }
    #fault-storyboard-v2 .support { color:var(--foreground); }
    #fault-storyboard-v2 .excluded { color:var(--muted-foreground); }
    #fault-storyboard-v2 .evidence-tabs { display:flex; flex-wrap:wrap; gap:6px; }
    #fault-storyboard-v2 .evidence-detail { min-height:205px; padding-top:3px; }
    #fault-storyboard-v2 pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--foreground); background:transparent; }
    #fault-storyboard-v2 .metric { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; padding:5px 0; border-bottom:1px solid var(--border); }
    #fault-storyboard-v2 .metric:last-child { border-bottom:0; }
    #fault-storyboard-v2 .future { opacity:.3; border-left:2px dashed var(--border); padding-left:12px; }
    #fault-storyboard-v2 .timeline { margin-top:14px; display:grid; grid-template-columns:repeat(8,1fr); gap:5px; }
    #fault-storyboard-v2 .tick { text-align:center; padding-top:6px; border-top:2px solid var(--border); color:var(--muted-foreground); }
    #fault-storyboard-v2 .tick.on { border-color:var(--viz-series-1); color:var(--foreground); }
    #fault-storyboard-v2 .controls { margin-top:14px; justify-content:space-between; }
    #fault-storyboard-v2 .scene-note { margin-top:8px; color:var(--muted-foreground); }
    @media (max-width:700px) {
      #fault-storyboard-v2 .main { grid-template-columns:1fr; }
      #fault-storyboard-v2 .topology { grid-template-columns:1fr; }
      #fault-storyboard-v2 .device { grid-template-columns:repeat(2,1fr); }
      #fault-storyboard-v2 .timeline { grid-template-columns:repeat(4,1fr); }
    }
    @media (prefers-reduced-motion:reduce) {
      #fault-storyboard-v2 .node { transition:none; }
    }
  </style>

  <div class="scene-head">
    <strong id="fv2-title">01 正常基线</strong>
    <span class="viz-badge" id="fv2-time">T-30s</span>
  </div>
  <div class="phase-track" aria-label="诊断阶段进度">
    <span class="phase done"></span><span class="phase"></span><span class="phase"></span><span class="phase"></span>
    <span class="phase"></span><span class="phase"></span><span class="phase"></span><span class="phase"></span>
  </div>

  <div class="main">
    <div class="canvas">
      <div class="topology" role="img" aria-label="双SAN访问存储、Controller-0A热复位的八幕诊断过程">
        <div class="lane">
          <div class="node" data-node="business">数据库业务</div>
          <div class="node" data-node="host">主机集群 ×2</div>
        </div>
        <div class="lane">
          <div class="node" data-node="san">双 SAN Fabric</div>
          <div class="link" data-link="access">→ 业务访问 →</div>
        </div>
        <div class="device">
          <span class="device-label text-small">Storage-01</span>
          <div class="zone">
            <span class="zone-label text-small">前端接入</span>
            <div class="node" data-node="fc">FC端口 ×8</div>
          </div>
          <div class="zone">
            <span class="zone-label text-small">控制服务</span>
            <div class="node" data-node="c0a">Controller-0A</div>
            <div class="node" data-node="c0b">Controller-0B</div>
          </div>
          <div class="zone">
            <span class="zone-label text-small">逻辑资源</span>
            <div class="node" data-node="block">Block Service</div>
            <div class="node" data-node="lun">LUN-DB01</div>
          </div>
          <div class="zone">
            <span class="zone-label text-small">物理资源</span>
            <div class="node" data-node="pool">Pool-01</div>
            <div class="node" data-node="disk">SSD ×24</div>
          </div>
        </div>
      </div>
      <div class="scene-note text-small" id="fv2-note">双Fabric、双控制器均正常，LUN平均时延1.8 ms。</div>
    </div>

    <section class="panel card" aria-live="polite">
      <div class="panel-heading">
        <strong id="fv2-panel-title">系统基线</strong>
        <span class="viz-badge" id="fv2-status">正常</span>
      </div>
      <div id="fv2-panel-body"></div>
    </section>
  </div>

  <div class="timeline" aria-label="场景时间轴">
    <span class="tick on">基线</span><span class="tick">触发</span><span class="tick">锁定</span><span class="tick">候选</span>
    <span class="tick">取证</span><span class="tick">验证</span><span class="tick">结论</span><span class="tick">规划</span>
  </div>

  <div class="viz-controls controls">
    <button type="button" class="btn" id="fv2-prev">上一步</button>
    <span class="text-muted" id="fv2-count">1 / 8</span>
    <button type="button" class="btn btn-primary" id="fv2-next">下一步</button>
  </div>

  <script>
    (function () {
      const root = document.getElementById("fault-storyboard-v2");
      const scenes = [
        {
          title:"01 正常基线", time:"T-30s", status:"正常", panel:"系统基线",
          note:"双Fabric、双控制器均正常，LUN平均时延1.8 ms。",
          nodes:{business:"",host:"",san:"",fc:"",c0a:"",c0b:"",block:"",lun:"",pool:"",disk:""},
          body:`<div class="stack">
            <div class="row"><span>LUN-DB01 平均时延</span><strong>1.8 ms</strong></div>
            <div class="row"><span>Controller-0A 吞吐</span><strong>8.4 GB/s</strong></div>
            <div class="row"><span>Controller-0B 吞吐</span><strong>7.9 GB/s</strong></div>
            <div class="row"><span>FC CRC错误增量</span><strong>0</strong></div>
          </div>`
        },
        {
          title:"02 故障现象触发", time:"14:32:18", status:"诊断中", panel:"诊断事件 #FD-20260730-001",
          note:"只呈现业务现象，不提前暴露根因。",
          nodes:{business:"warn",host:"warn",san:"",fc:"",c0a:"",c0b:"",block:"",lun:"warn",pool:"",disk:""},
          body:`<div class="stack">
            <div class="row"><span>现象</span><strong>数据库访问变慢</strong></div>
            <div class="row"><span>对象</span><strong>LUN-DB01</strong></div>
            <div class="row"><span>平均时延</span><strong>1.8 → 38.6 ms</strong></div>
            <div class="row"><span>异常发生</span><strong>14:32:18.067</strong></div>
          </div>`
        },
        {
          title:"03 现象映射与范围锁定", time:"14:32:19", status:"路径分析", panel:"Agent 当前判断",
          note:"业务描述被映射为标准故障现象，调查范围锁定在块访问路径。",
          nodes:{business:"active",host:"active",san:"active",fc:"active",c0a:"",c0b:"",block:"active",lun:"warn",pool:"dim",disk:"dim"},
          body:`<div class="stack">
            <div class="row"><span>用户现象</span><strong>数据库访问变慢</strong></div>
            <div class="row"><span>标准现象</span><strong>LUN读写时延升高</strong></div>
            <div class="row"><span>调查边界</span><strong>块业务访问路径</strong></div>
            <div class="row"><span>已排除域</span><strong>NAS／容量域</strong></div>
          </div>`
        },
        {
          title:"04 候选根因生成", time:"14:32:20", status:"4个候选", panel:"候选根因与初始置信度",
          note:"候选来自现象、对象类型、拓扑邻接和故障知识，不标记最终根因。",
          nodes:{business:"warn",host:"active",san:"warn",fc:"warn",c0a:"warn",c0b:"",block:"active",lun:"warn",pool:"warn",disk:"dim"},
          body:`<div class="stack">
            <div class="row"><span>Controller-0A 热复位</span><strong class="confidence">42%</strong></div>
            <div class="row"><span>FC端口链路抖动</span><strong class="confidence">28%</strong></div>
            <div class="row"><span>SAN交换链路异常</span><strong class="confidence">18%</strong></div>
            <div class="row"><span>存储池性能瓶颈</span><strong class="confidence">12%</strong></div>
          </div>`
        },
        {
          title:"05 并行取证与 Skill 执行", time:"14:32:21—25", status:"5/5 已返回", panel:"真实证据视图",
          note:"告警、日志指纹、KPI、拓扑与历史案例按统一时间轴对齐。",
          nodes:{business:"warn",host:"active",san:"active",fc:"active",c0a:"warn",c0b:"good",block:"active",lun:"warn",pool:"dim",disk:"dim"},
          evidence:true
        },
        {
          title:"06 证据融合与候选排除", time:"14:32:26", status:"已收敛", panel:"置信度变化与原因",
          note:"每个数字变化都能追溯到支持证据或反证。",
          nodes:{business:"warn",host:"active",san:"dim",fc:"dim",c0a:"root",c0b:"good",block:"active",lun:"warn",pool:"dim",disk:"dim"},
          body:`<div class="stack">
            <div class="row support"><span>Controller-0A 热复位<br><span class="text-muted text-small">告警＋指纹＋吞吐归零＋0B接管＋相似案例</span></span><strong class="confidence">42% → 68% → 96%</strong></div>
            <div class="row excluded"><span>FC端口链路抖动<br><span class="text-small">CRC增量为0，端口状态正常</span></span><strong class="confidence">28% → 3%</strong></div>
            <div class="row excluded"><span>SAN交换链路异常<br><span class="text-small">双Fabric均无链路异常</span></span><strong class="confidence">18% → 1%</strong></div>
            <div class="row excluded"><span>存储池性能瓶颈<br><span class="text-small">利用率63.2%，无突增</span></span><strong class="confidence">12% → 2%</strong></div>
          </div>`
        },
        {
          title:"07 根因诊断完成", time:"14:32:27", status:"置信度 96%", panel:"诊断结论",
          note:"根因链、影响链、冗余接管链和恢复结果完成闭合。",
          nodes:{business:"warn",host:"active",san:"active",fc:"active",c0a:"root",c0b:"good",block:"active",lun:"warn",pool:"dim",disk:"dim"},
          body:`<div class="stack">
            <div class="row"><span>根因</span><strong>Controller-0A 热复位</strong></div>
            <div class="row"><span>触发原因</span><strong>watchdog_timeout</strong></div>
            <div class="row"><span>影响链</span><strong>0A复位 → 服务切换 → LUN时延升高</strong></div>
            <div class="row"><span>冗余接管</span><strong>Controller-0B，4.7 s</strong></div>
            <div class="row"><span>当前状态</span><strong>业务时延已回落</strong></div>
          </div>`
        },
        {
          title:"08 当前版本终点与后续规划", time:"诊断结束", status:"报告已生成", panel:"能力边界",
          note:"当前版本高亮完成根因诊断；修复闭环仅作为下一版本能力预告。",
          nodes:{business:"active",host:"active",san:"active",fc:"active",c0a:"root",c0b:"good",block:"active",lun:"active",pool:"dim",disk:"dim"},
          body:`<div class="stack">
            <div class="row"><span>根因诊断</span><strong>✓ 已完成</strong></div>
            <div class="row"><span>影响分析</span><strong>✓ 已完成</strong></div>
            <div class="row"><span>诊断报告</span><strong>✓ 已生成</strong></div>
            <div class="future">
              <div class="row"><span>生成处置方案</span><strong>下一版本</strong></div>
              <div class="row"><span>风险评估与人工审批</span><strong>下一版本</strong></div>
              <div class="row"><span>执行、验证与失败回退</span><strong>下一版本</strong></div>
            </div>
          </div>`
        }
      ];
      const evidence = {
        alarm:{
          label:"告警",
          html:`<div class="stack">
            <div class="row"><span>告警ID</span><strong>ALM-0A-78421</strong></div>
            <div class="row"><span>告警名称</span><strong>控制器发生热复位</strong></div>
            <div class="row"><span>对象／级别</span><strong>Controller-0A／严重</strong></div>
            <div class="row"><span>发生／恢复</span><strong>14:32:17.842／14:32:23.106</strong></div>
          </div>`
        },
        log:{
          label:"日志指纹",
          html:`<pre><code>原始日志
2026-07-30 14:32:17.615 WARN controller[0A]:
warm reset triggered, reason=watchdog_timeout,
service=block

归一化指纹
controller &lt;*&gt; warm_reset
reason=&lt;WATCHDOG_TIMEOUT&gt; service=&lt;BLOCK&gt;

指纹ID  FP-CTRL-WARM-RESET-017
窗口命中  14:32:16—14:32:20 内 7 次</code></pre>`
        },
        kpi:{
          label:"KPI",
          html:`<div class="stack">
            <div class="metric"><span>0A I/O吞吐</span><strong>8.4 GB/s → 0</strong></div>
            <div class="metric"><span>LUN平均时延</span><strong>1.8 → 38.6 ms</strong></div>
            <div class="metric"><span>0B I/O吞吐</span><strong>7.9 → 15.6 GB/s</strong></div>
            <div class="metric"><span>服务切换耗时</span><strong>4.7 s</strong></div>
            <div class="metric"><span>FC CRC错误增量</span><strong>0</strong></div>
            <div class="metric"><span>Pool利用率</span><strong>63.2%，无突增</strong></div>
          </div>`
        },
        topo:{
          label:"拓扑",
          html:`<div class="stack">
            <div class="row"><span>异常路径</span><strong>0A → Block Service → LUN-DB01</strong></div>
            <div class="row"><span>冗余控制器</span><strong>Controller-0B</strong></div>
            <div class="row"><span>接管证据</span><strong>0B吞吐同步上升</strong></div>
            <div class="row"><span>时间差</span><strong>告警早于业务异常 225 ms</strong></div>
          </div>`
        },
        case:{
          label:"历史案例",
          html:`<div class="stack">
            <div class="row"><span>案例</span><strong>Case-20260618-023</strong></div>
            <div class="row"><span>相似度</span><strong>91.4%</strong></div>
            <div class="row"><span>历史根因</span><strong>控制器热复位</strong></div>
            <div class="row"><span>共同特征</span><strong>同指纹＋主备吞吐切换</strong></div>
          </div>`
        }
      };
      let index = 0;
      let evidenceKey = "alarm";
      const title = root.querySelector("#fv2-title");
      const time = root.querySelector("#fv2-time");
      const status = root.querySelector("#fv2-status");
      const panelTitle = root.querySelector("#fv2-panel-title");
      const panelBody = root.querySelector("#fv2-panel-body");
      const note = root.querySelector("#fv2-note");
      const count = root.querySelector("#fv2-count");
      const prev = root.querySelector("#fv2-prev");
      const next = root.querySelector("#fv2-next");

      function evidenceBody() {
        const tabs = Object.keys(evidence).map(function (key) {
          const cls = key === evidenceKey ? "btn btn-primary" : "btn";
          return `<button type="button" class="${cls}" data-evidence="${key}" aria-pressed="${key === evidenceKey}">${evidence[key].label}</button>`;
        }).join("");
        return `<div class="evidence-tabs">${tabs}</div><div class="evidence-detail">${evidence[evidenceKey].html}</div><div class="text-muted text-small">基线场景样例数据；正式版本替换为故障注入 Case 实测值。</div>`;
      }

      function render() {
        const scene = scenes[index];
        title.textContent = scene.title;
        time.textContent = scene.time;
        status.textContent = scene.status;
        panelTitle.textContent = scene.panel;
        note.textContent = scene.note;
        count.textContent = `${index + 1} / ${scenes.length}`;
        panelBody.innerHTML = scene.evidence ? evidenceBody() : scene.body;
        root.querySelectorAll("[data-node]").forEach(function (el) {
          el.className = "node " + (scene.nodes[el.dataset.node] || "");
        });
        root.querySelectorAll(".phase").forEach(function (el, i) {
          el.classList.toggle("done", i <= index);
        });
        root.querySelectorAll(".tick").forEach(function (el, i) {
          el.classList.toggle("on", i === index);
        });
        root.querySelector("[data-link='access']").classList.toggle("hot", index >= 1 && index <= 6);
        prev.disabled = index === 0;
        next.disabled = index === scenes.length - 1;
        next.textContent = index === scenes.length - 1 ? "已完成" : "下一步";
      }

      root.addEventListener("click", function (event) {
        const tab = event.target.closest("[data-evidence]");
        if (tab) {
          evidenceKey = tab.dataset.evidence;
          render();
        }
      });
      prev.addEventListener("click", function () {
        if (index > 0) { index -= 1; render(); }
      });
      next.addEventListener("click", function () {
        if (index < scenes.length - 1) { index += 1; render(); }
      });
      render();
    })();
  </script>
</div>
